@if (!loading()) {
  <div class="flex flex-col items-center h-full max-w-[960px] p-6">
    <header class="w-full">
      <div class="w-full flex items-center justify-between gap-3">
        <app-icon-button
          [iconName]="practiceKind() === 'sentence' ? 'edit' : 'menu_book'"
          [label]="practiceKind() === 'sentence' ? 'Sätze' : 'Wörter'"
          [chevron]="true"
          tooltip="Übungsmodus"
          tooltipPosition="bottom"
          (onClick)="togglePanel()"
        />

        <app-practice-direction-toggle
          [mode]="practiceMode()"
          (modeChange)="onPracticeModeChange($event)"
        />
      </div>
    </header>

    <app-practice-panel
      [open]="panelOpen()"
      [practiceKind]="practiceKind()"
      (close)="closePanel()"
      (practiceKindChange)="onPracticeKindChange($event)"
      (lessonChange)="onLessonChange($event)"
      (exportPdf)="exportPdf()"
    />

    <main class="mt-8 grow w-full">
        <app-practice-host
          [practiceKind]="practiceKind()"
          [selectedLesson]="selectedLesson()"
        />
    </main>
  </div>
} @else {
  <div class="flex items-center justify-center h-screen">Lade Vokabeln…</div>
}
