<div class="w-full h-full flex flex-col items-center p-6 cursor-pointer"
     (click)="onCardClick()">
    <div class="w-full flex flex-row items-center justify-between">
      @if (meta() && meta()!['category']) {
        <div class="italic opacity-50">{{ meta()!['category'] }}</div>
      }
      <div class="flex items-center text-sm italic opacity-50 transition-opacity duration-300 hover:opacity-100">
        <mat-icon class="mr-1">ads_click</mat-icon>
        <span>Flip</span>
      </div>
    </div>
    <div class="w-full grow flex flex-col items-center justify-center">
      <div
        #faceContainer
        class="relative w-full min-h-[160px] select-none cursor-pointer"
      >
        @if (renderLanguage()=== 'fr') {
          <app-card-face
            [primary]="frenchPrimary()"
            [secondary]="frenchSecondary()"
            [language]="'fr'"
            [needsVowelArticle]="meta()?.['fr_needs_vowel_article']"
            [genus]="meta()?.['fr_genus']"
          />
        } @else {
          <app-card-face
            [primary]="germanPrimary()"
            [secondary]="germanSecondary()"
            [language]="'de'"
            [needsVowelArticle]="false"
            [genus]="meta()?.['de_genus']"
          />
        }

      </div>
    </div>
    <div class="flex flex-row items-center justify-between w-full h-12">
      <div class="relative flex items-center h-5 select-none text-sm opacity-60">
        <div class="flex items-center gap-2 absolute left-0 transition-opacity duration-300"
             [class.opacity-100]="renderLanguage()=== 'fr'" [class.opacity-0]="renderLanguage()=== 'de'">
          <app-lang-indicator [lang]="'fr'"></app-lang-indicator>
        </div>
        <div class="flex items-center gap-2 absolute left-0 transition-opacity duration-300"
             [class.opacity-100]="renderLanguage()=== 'de'" [class.opacity-0]="renderLanguage()=== 'fr'">
          <app-lang-indicator [lang]="'de'"></app-lang-indicator>
        </div>
      </div>

      <!-- Lautsprecher unten rechts nur einblenden, wenn verfügbar -->
      <button
        class="w-10 h-10 flex items-center justify-center rounded-2xl border border-neutral-300
      bg-white/80 hover:bg-neutral-200 active:bg-neutral-300
      transition-opacity duration-150"
        (click)="toggleSpeak($event)"
        (touchstart)="$event.stopPropagation()"
        (touchmove)="$event.stopPropagation()"
        (touchend)="$event.stopPropagation()"
        [class.opacity-100]="canSpeak()"
        [class.opacity-0]="!canSpeak()"
        [disabled]="!canSpeak()"
        [attr.aria-label]="isSpeaking() ? 'Vorlesen stoppen' : 'Vorlesen starten'"
        [attr.title]="isSpeaking() ? 'Vorlesen stoppen' : 'Vorlesen starten'"
      >
        <mat-icon>{{ isSpeaking() ? 'stop' : 'volume_up' }}</mat-icon>
      </button>

    </div>
</div>
