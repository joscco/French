<div class="w-full flex flex-row gap-3">
  <!-- Group Selector -->
  <div class="flex-1 flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-600">Gruppe</label>
    <select
      class="block w-full px-4 py-3 text-base bg-white border border-gray-300 rounded-lg shadow-sm appearance-none
             focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500"
      [value]="selectedGroupId()"
      (change)="onGroupChange($any($event.target).value)"
    >
      <option value="all">Alle Gruppen</option>
      @for (group of groups(); track group.id) {
        <option [value]="group.id">{{ group.name }}</option>
      }
    </select>
  </div>

  <!-- Unit Selector -->
  <div class="flex-1 flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-600">Lektion</label>
    <select
      class="block w-full px-4 py-3 text-base bg-white border border-gray-300 rounded-lg shadow-sm appearance-none
             focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500"
      [value]="selectedUnitId()"
      (change)="onUnitChange($any($event.target).value)"
    >
      <option value="all">Alle Lektionen</option>
      @for (unit of filteredUnits(); track unit.id) {
        <option [value]="unit.id">{{ unit.name }}</option>
      }
    </select>
  </div>
</div>
