<div class="relative">
  <select
    class="block w-full px-4 py-3 text-base bg-white border border-gray-300 rounded-lg shadow-sm appearance-none
           focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500 peer"
    [value]="selected?.id"
    (change)="onSelectedChange($any($event.target).value)"
  >
    @for (lesson of lessons; track lesson.id) {
      <option [value]="lesson.id">{{ lesson.label }}</option>
    }
  </select>
</div>
