<!-- Backdrop -->
<div
  #backdrop
  class="fixed inset-0 z-40 bg-black/30 opacity-0 pointer-events-none"
  (click)="onBackdropClick()"
></div>

<!-- Sheet -->
<div class="fixed inset-x-0 bottom-0 z-50 mx-auto w-full max-w-[960px] pointer-events-none">
  <div
    #sheet
    class="rounded-t-3xl border border-neutral-300 bg-white shadow-2xl pointer-events-auto will-change-transform"
  >
    <!-- Header -->
    <div class="px-4 pt-3 pb-2">
      <div class="mx-auto mb-2 h-1.5 w-10 rounded-full bg-neutral-300"></div>

      <div class="flex items-center justify-between">
        <div class="text-sm font-semibold text-neutral-800">Einstellungen</div>
        <app-icon-button
          iconName="close"
          tooltip="Schließen"
          tooltipPosition="top"
          (onClick)="close.emit()"
        />
      </div>
    </div>

    <div class="px-4 pb-4 flex flex-col gap-4">
      <!-- Übungsmodus -->
      <div class="flex flex-col gap-2">
        <div class="text-xs font-semibold tracking-wide text-neutral-500">Übungsmodus</div>

        <div class="grid grid-cols-3 gap-2">
          <button
            class="rounded-2xl border px-3 py-2 text-sm font-medium transition-colors"
            [class.hover:bg-neutral-200]="practiceKind()!=='vocab'"
            [class.active:bg-neutral-100]="practiceKind()!=='vocab'"
            [class.bg-neutral-900]="practiceKind() === 'vocab'"
            [class.text-white]="practiceKind() === 'vocab'"
            [class.border-neutral-900]="practiceKind() === 'vocab'"
            [class.border-neutral-200]="practiceKind() !== 'vocab'"
            (click)="setPracticeKind('vocab')"
          >
            Wörter
          </button>

          <button
            class="rounded-2xl border px-3 py-2 text-sm font-medium transition-colors"
            [class.hover:bg-neutral-200]="practiceKind()!=='sentence'"
            [class.active:bg-neutral-100]="practiceKind()!=='sentence'"
            [class.bg-neutral-900]="practiceKind() === 'sentence'"
            [class.text-white]="practiceKind() === 'sentence'"
            [class.border-neutral-900]="practiceKind() === 'sentence'"
            [class.border-neutral-200]="practiceKind() !== 'sentence'"
            (click)="setPracticeKind('sentence')"
          >
            Sätze
          </button>

          <button
            class="rounded-2xl border border-neutral-200 px-3 py-2 text-sm font-medium text-neutral-400"
            disabled
            title="Kommt bald"
          >
            Lücken
          </button>
        </div>
      </div>

      <!-- Lektion -->
      <div class="flex flex-col gap-2">
        <div class="text-xs font-semibold tracking-wide text-neutral-500">Auswahl</div>

        <app-lesson-selector
          (selectionChange)="onLessonSelected($event)"
        />
      </div>

      <!-- Aktionen -->
      <div class="flex items-center gap-2 pt-2">
        <button
          class="inline-flex items-center gap-2 rounded-2xl border border-neutral-300 bg-white px-4 py-2
                 text-sm font-medium shadow-sm hover:bg-neutral-50 active:bg-neutral-100"
          (click)="triggerExport()"
        >
          <span class="material-icons text-[20px]">download</span>
          Vokabeln downloaden
        </button>
      </div>
    </div>
  </div>
</div>
