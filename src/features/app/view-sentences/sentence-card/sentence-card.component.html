<div #swapHost class="relative w-full h-full" data-swap-host data-swipe-surface>
  <div class="px-6 py-4 flex flex-col h-full">

    <app-term-tooltip-overlay
      [open]="tooltipOpen()"
      [selectedVM]="tooltipVm()"
      [basisX]="tooltipBasisX()"
      [x]="tooltipX()"
      [y]="tooltipY()"
      (panelRectChange)="onTooltipPanelRect($event)"
    ></app-term-tooltip-overlay>

    <app-prompt-markup
      class="min-h-[80px] flex flex-row items-center"
      [segments]="promptSegments()"
      [fallbackText]="mode() === 'de-fr' ? sentence()?.de : sentence()?.fr"
      [activeRefKey]="activeRefKey()"
      (termEnter)="onPromptTermEnter($event)"
      (termLeave)="onPromptTermLeave()"
      (termClick)="onPromptTermClick($event)"
    ></app-prompt-markup>

    <div class="flex-1 min-h-0 flex flex-col py-4">

      <!-- "Fake textarea" box -->
      <div class="relative flex-1 min-h-0 overflow-hidden rounded-2xl bg-neutral-100
               transition-[box-shadow,background-color] duration-200 py-2"
           [class.ring-2]="isChecked()"
           [class.ring-green-400]="isChecked() && isCorrect()"
           [class.ring-red-300]="isChecked() && !isCorrect()"
           [class.bg-green-50]="isChecked() && isCorrect()"
      >

        <!-- Checked overlay (diff rendering) -->
        <div
          #overlayLayer
          class="absolute inset-0 z-20 pointer-events-none
                     p-6 text-left font-sans tracking-normal
                     text-lg leading-7 font-normal antialiased
                     whitespace-pre-wrap break-words"
          [class.opacity-0]="!isChecked()"
          aria-hidden="true"
        >
          @for (t of displayTokens(); track $index) {
            @if (!t.isWord) {
              <span>{{ t.text }}</span>
            } @else if (t.kind === 'missing') {
              <span class="text-neutral-400 underline decoration-neutral-300 decoration-2 underline-offset-4"
              >{{ t.badge ?? '' }}
                  </span>
            } @else {
              <span class="rounded-sm"
                    [class.line-through]="t.kind !== 'ok'"
                    [class.bg-red-200]="t.kind === 'wrong'"
                    [class.text-red-900]="t.kind === 'wrong'"
                    [class.bg-amber-200]="t.kind === 'soft'"
                    [class.text-amber-900]="t.kind === 'soft'">{{ t.text }}</span>
              <span>{{ t.badge }}</span>
            }
          }
        </div>

        <!-- Edit layer (real textarea) -->
        <textarea
          #editLayer
          [(ngModel)]="answerModel"
          class="absolute inset-0 z-10 w-full h-full
                     p-6 bg-transparent resize-none
                     text-left font-sans tracking-normal
                     text-lg leading-7 font-normal antialiased
                     placeholder:text-neutral-500
                     outline-none focus:outline-none focus:ring-0
                     whitespace-pre-wrap break-words"
          [class.opacity-0]="isChecked()"
          [class.pointer-events-none]="isChecked()"
          placeholder="Übersetzung hier eintippen..."
        ></textarea>
      </div>
    </div>

    <!-- FOOTER SLOT (no layout jump) -->
    <div #footerSlot class="relative h-12">
      <!-- Check button -->
      <div
        #footerCheck
        class="absolute inset-0"
        [class.pointer-events-none]="isChecked()"
        [class.opacity-0]="isChecked()"
      >
        <button
          class="w-full h-12 rounded-2xl bg-neutral-900 text-white z-10
                       transition-colors duration-150 hover:bg-neutral-800 active:bg-neutral-950"
          (click)="checkAnimated()"
        >
          Prüfen
        </button>
      </div>

      <!-- Action bar -->
      <div
        #footerBar
        class="absolute inset-0"
        [class.pointer-events-none]="!isChecked()"
        [class.opacity-0]="!isChecked()"
      >
        <div class="flex flex-row items-center justify-center gap-3 h-12">
          <!-- Französisch Audio -->
          <button
            class="h-10 px-3 inline-flex items-center justify-center gap-1.5 rounded-xl border border-neutral-300
                   transition-colors duration-150 bg-transparent hover:bg-neutral-200 active:bg-neutral-300
                   disabled:opacity-50 disabled:pointer-events-none"
            [disabled]="!isCorrect()"
            (click)="playFr($event)"
            title="Französisch abspielen"
          >
            <mat-icon class="text-lg">{{ isPlaying() ? 'stop' : 'volume_up' }}</mat-icon>
            <span class="text-xs font-bold text-slate-500">FR</span>
          </button>

          <!-- Deutsch Audio -->
          <button
            class="h-10 px-3 inline-flex items-center justify-center gap-1.5 rounded-xl border border-neutral-300
                   transition-colors duration-150 bg-transparent hover:bg-neutral-200 active:bg-neutral-300
                   disabled:opacity-50 disabled:pointer-events-none"
            [disabled]="!isCorrect()"
            (click)="playDe($event)"
            title="Deutsch abspielen"
          >
            <mat-icon class="text-lg">{{ isPlaying() ? 'stop' : 'volume_up' }}</mat-icon>
            <span class="text-xs font-bold text-slate-500">DE</span>
          </button>

          <app-icon-button
            iconName="edit"
            tooltip="Bearbeiten"
            (onClick)="editAgainAnimated()"
          >
          </app-icon-button>
        </div>
      </div>
    </div>
  </div>
</div>
