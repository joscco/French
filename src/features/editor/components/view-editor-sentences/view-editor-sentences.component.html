<div class="w-full min-h-0 h-full flex-1 flex flex-row items-stretch gap-3">
  <!-- Sentence List Panel -->
  <div
    class="flex min-h-0 min-w-0 flex-1 flex-col gap-2 rounded-2xl border border-slate-200 bg-white p-3 overflow-hidden">
    <!-- Filters -->
    <div class="w-full flex flex-row items-end gap-2">
      <!-- Group Filter -->
      <span>
        <span class="text-xs text-slate-400">Group</span>
        <select
          class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
          [ngModel]="selectedGroupId()"
          (ngModelChange)="changeGroupFilter($event)"
          [disabled]="state() !== 'ready'">
          @for (option of groupOptions(); track option.id) {
            <option [ngValue]="option.id">{{ option.label }}</option>
          }
        </select>
      </span>
      <!-- Unit Filter -->
      <span>
        <span class="text-xs text-slate-400">Unit</span>
        <select
          class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
          [ngModel]="selectedUnitId()"
          (ngModelChange)="changeUnitFilter($event)"
          [disabled]="state() !== 'ready'">
          @for (option of unitOptions(); track option.id) {
            <option [ngValue]="option.id">{{ option.label }}</option>
          }
        </select>
      </span>
      <!-- Create New Sentence -->
      <button
        type="button"
        class="mt-1 shrink-0 rounded-xl border border-slate-200 bg-slate-100 px-3 py-2 text-sm font-semibold
      hover:bg-slate-200 disabled:cursor-not-allowed disabled:opacity-50 transition-all flex items-start"
        (click)="createSentence()"
        [disabled]="state() !== 'ready' || !selectedUnitId()">
        + Add Sentence
      </button>
    </div>
    <!-- NEW: Sentence table (replaces old card list) -->
    <div class="min-h-0 flex-1 overflow-hidden">
      <app-sentences-table
        class="h-full min-h-0 flex flex-col"
        [sentences]="filteredSentences()"
        [selectedSentenceId]="selectedSentenceId()"
        (selectSentence)="selectSentence($event)"
      ></app-sentences-table>
    </div>
  </div>
  <!-- Sentence Detail Panel -->
  @if (selectedSentence(); as sentence) {
    <div class="min-h-0 min-w-0 flex-1 overflow-auto rounded-2xl border border-slate-200 bg-white p-3">
      <div class="mb-3 flex items-baseline justify-between">
        <div class="text-lg font-black text-slate-900">Sentence #{{ sentence.id }}</div>
        <div class="text-sm text-slate-600">{{ unitLabel(sentence.unitId) }}</div>
      </div>
      <div class="flex flex-col gap-3">
        <app-sentence-side-editor
          [sentenceId]="sentence.id"
          lang="fr"
          [selectedTermId]="selectedTermId()"
          (editTerm)="onEditTerm($event)"
        />
        <app-sentence-side-editor
          [sentenceId]="sentence.id"
          lang="de"
          [selectedTermId]="selectedTermId()"
          (editTerm)="onEditTerm($event)"
        />
      </div>
    </div>
  } @else {
    <div class="min-h-0 min-w-0 flex-1 rounded-2xl border border-dashed border-slate-300 bg-white p-6 text-slate-600">
      Select a sentence on the left.
    </div>
  }
  <!-- Term Editor Panel -->
  <div class="min-h-0 min-w-0 flex-1 overflow-auto rounded-2xl border border-slate-200 bg-white p-3">
    <div class="mb-2 flex items-center justify-between">
      <div class="text-sm font-extrabold text-slate-900">Term details</div>
      <button
        type="button"
        class="rounded-lg border border-slate-200 bg-white px-2 py-1 text-xs font-semibold hover:bg-slate-50"
        (click)="clearSelectedTerm()">
        Clear
      </button>
    </div>
    <app-term-editor [termId]="selectedTermId()"></app-term-editor>
  </div>
</div>
