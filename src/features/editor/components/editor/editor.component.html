<div class="flex h-full w-full flex-col gap-3 p-3">
  <!-- Topbar -->
  <div class="flex flex-wrap items-center justify-between">
    <div class="text-lg font-extrabold text-slate-300 px-2">Editor</div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="rounded-xl border px-3 py-2 text-sm font-semibold"
        [ngClass]="viewMode() === 'sentences'
          ? 'border-slate-400 bg-slate-50 text-slate-900'
          : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'"
        (click)="setViewMode('sentences')"
      >
        Sentences
      </button>

      <button
        type="button"
        class="rounded-xl border px-3 py-2 text-sm font-semibold"
        [ngClass]="viewMode() === 'terms'
          ? 'border-slate-400 bg-slate-50 text-slate-900'
          : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'"
        (click)="setViewMode('terms')"
      >
        All Terms
      </button>
    </div>

    <!-- Save Buttons -->
    <div class="flex items-center gap-2">
      @if (serverAvailable) {
        <button
          type="button"
          class="rounded-xl border px-3 py-2 text-sm font-semibold transition flex items-center gap-2"
          [ngClass]="{
            'border-emerald-300 bg-emerald-50 text-emerald-700': saveState() === 'success',
            'border-rose-300 bg-rose-50 text-rose-700': saveState() === 'error',
            'border-slate-200 bg-white text-slate-900 hover:bg-slate-50': saveState() === 'idle',
            'border-slate-300 bg-slate-100 text-slate-500': saveState() === 'saving'
          }"
          (click)="saveDirectly()"
          [disabled]="state() !== 'ready' || saveState() === 'saving'"
          [title]="saveError() || ''"
        >
          @if (saveState() === 'saving') {
            <mat-icon>hourglass_empty</mat-icon>
          } @else if (saveState() === 'success') {
            <mat-icon>check_circle</mat-icon>
          } @else if (saveState() === 'error') {
            <mat-icon>warning</mat-icon>
          } @else {
            <mat-icon>save</mat-icon>
          }

          <span>
            @if (saveState() === 'saving') {
              Speichere…
            } @else if (saveState() === 'success') {
              Gespeichert
            } @else if (saveState() === 'error') {
              Fehler
            } @else {
              Speichern
            }
          </span>
        </button>
      }

      <button
        type="button"
        class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold
        text-slate-900 hover:bg-slate-50 flex items-center gap-2"
        (click)="saveAsCSVs()"
        [disabled]="state() !== 'ready'"
        [title]="serverAvailable ? 'Als ZIP herunterladen' : 'Server nicht verfügbar - Download als ZIP'"
      >
        <mat-icon>file_download</mat-icon>
        <span>Download</span>
      </button>
    </div>
  </div>

  <!-- Loading / Error -->
  @if (state() === 'loading') {
    <div class="rounded-2xl border border-slate-200 bg-white p-3 text-sm text-slate-600">
      Loading CSVs…
    </div>
  }

  @if (state() === 'error') {
    <div class="rounded-2xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700">
      Load failed: {{ error() }}
      <div class="mt-2">
        <button
          type="button"
          class="rounded-lg border border-rose-200 bg-white px-2 py-1 text-xs font-semibold hover:bg-rose-50"
          (click)="load()"
        >
          Retry
        </button>
      </div>
    </div>
  }

  <!-- Body -->
  @if (viewMode() === 'sentences') {
    <app-sentences-view class="h-full flex-1 min-h-0"></app-sentences-view>
  } @else {
    <app-all-terms-translations class="h-full flex-1 min-h-0"></app-all-terms-translations>
  }
</div>
