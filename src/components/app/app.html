@if (!loading()) {
  <div class="flex flex-col items-center h-full max-w-[960px] p-6">
    <header class="self-center flex flex-col gap-6 items-center">
      <div class="flex flex-row items-end justify-between w-full gap-4">
        <app-lesson-selector
          [lessons]="lessons()"
          [selected]="selectedLessons()"
          (selectedChange)="onLessonsChange($event)"/>
        <app-mode-selector
          [mode]="practiceMode()"
          (modeChange)="practiceMode.set($event)"
        />
        <app-icon-button
          iconName="menu_book"
          tooltip="Vokabeltraining"
          (onClick)="practiceKind.set('vocab')"
        ></app-icon-button>
        <app-icon-button
          iconName="edit"
          tooltip="Satztraining"
          (onClick)="practiceKind.set('sentence')"
        ></app-icon-button>
        <app-icon-button iconName="download" (onClick)="exportPdf()" tooltip="Download"/>
      </div>
    </header>

    <main class="mt-8 grow w-full">
      @if (practiceKind() === 'vocab') {
        <app-word-practice
          [cards]="practiceCards()"
          [mode]="practiceMode()"
        />
      } @else {
        <app-sentence-practice
          [sentences]="sentences()"
          [mode]="practiceMode()"
        />
      }
    </main>
  </div>
} @else {
  <div class="flex items-center justify-center h-screen">Lade Vokabeln…</div>
}
