@if (!loading()) {
  <div class="flex flex-col items-center h-full max-w-[960px] p-6">
    <header class="w-full">
      <div class="w-full flex items-center justify-between gap-3">
        <app-icon-button
          [iconName]="practiceKind() === 'sentence' ? 'edit' : 'menu_book'"
          [label]="practiceKind() === 'sentence' ? 'Sätze' : 'Wörter'"
          [chevron]="true"
          tooltip="Übungsmodus"
          tooltipPosition="bottom"
          (onClick)="togglePanel()"
        />

        <app-practice-direction-toggle
          [mode]="practiceMode()"
          (modeChange)="practiceMode.set($event)"
        />
      </div>
    </header>

    <app-practice-panel
      [open]="panelOpen()"
      [practiceKind]="practiceKind()"
      [lessons]="lessons()"
      [selectedLesson]="selectedLessons()"
      (close)="closePanel()"
      (practiceKindChange)="practiceKind.set($event); closePanel()"
      (lessonChange)="onLessonsChange($event)"
      (exportPdf)="exportPdf()"
    />

    <main class="mt-8 grow w-full">
      @if (practiceKind() === 'vocab') {
        <app-word-practice
          [cards]="practiceCards()"
          [mode]="practiceMode()"
        />
      } @else {
        <app-sentence-practice
          [sentences]="sentences()"
          [mode]="practiceMode()"
        />
      }
    </main>
  </div>
} @else {
  <div class="flex items-center justify-center h-screen">Lade Vokabeln…</div>
}
