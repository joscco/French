<div class="absolute -right-4 top-0 bottom-4 w-8">
  <div
    #scrubberEl
    data-scrubber
    class="absolute inset-y-0 right-0 w-8 cursor-grab active:cursor-grabbing touch-none select-none z-40"
    style="
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    "
    (pointerdown)="pointerDown.emit($event)"
    (pointermove)="pointerMove.emit($event)"
    (pointerup)="pointerUp.emit($event)"
    (pointercancel)="pointerUp.emit($event)"
  >
    <!-- Track -->
    <div class="absolute inset-y-0 right-4 w-1 rounded-full transition-opacity duration-150"
         [class.opacity-100]="scrubPreview?.active || isTouchScreen"
         [class.opacity-40]="!(scrubPreview?.active || isTouchScreen)"
    >

      <!-- Base dots (immer) -->
      <div class="absolute inset-0 rounded-full"
           style="
           background-image: radial-gradient(circle, rgba(90,90,90,0.26) 1.8px, transparent 2px);
           background-size: 10px 10px;
           background-position: center;
         ">
      </div>

      <!-- Hotspot overlay: größere + dunklere dots, nur rund um den Thumb sichtbar -->
      <div class="absolute inset-0 rounded-full pointer-events-none opacity-90"
           [style.webkitMaskImage]="hotspotMask"
           [style.maskImage]="hotspotMask"
           style="
           background-image: radial-gradient(circle, rgba(40,40,40,0.55) 3.2px, transparent 3.4px);
           background-size: 10px 10px;
           background-position: center;
         ">
      </div>
    </div>

    <!-- Thumb (normal, clean) -->
    <div
      class="absolute right-1.5 w-3 h-10 rounded-full
     bg-neutral-400/60 shadow-sm
     opacity-0 transition-opacity duration-150"
      [class.opacity-100]="scrubPreview?.active"
      [style.top.%]="thumbTopPct"
      style="transform: translateY(-50%) translateX(-50%)"
    ></div>


    <!-- Bubble -->
    @if (scrubPreview?.active) {
      <div class="absolute right-7" [style.top.%]="length > 1 ? ((scrubPreview?.idx ?? 0) / (length - 1)) * 100 : 0" style="transform: translateY(-50%)">
        <div class="px-2 py-1 rounded-lg border bg-white text-xs shadow">
          {{ scrubPreview?.label }}
        </div>
      </div>
    }
  </div>
</div>
