<app-practice-host-shell
  [index]="index()"
  [length]="currentListLength()"
  [showShuffle]="true"
  [showScrubber]="true"
  [animation]="'slide'"
  [scrubLabelForIndex]="scrubLabelForIndex"
  (commitIndex)="onCommitIndex($event)"
  (shuffle)="shuffle()"
>
  @if (practiceKind() === 'vocab') {
    @if (currentVocab(); as vocabCard) {
      <app-word-card
        [meta]="vocabCard.meta || {}"
        [frenchPrimary]="vocabCard.frenchPrimary"
        [frenchSecondary]="vocabCard.frenchSecondary || ''"
        [germanPrimary]="vocabCard.germanPrimary"
        [germanSecondary]="vocabCard.germanSecondary || ''"
        [frontLang]="vocabCard.frontLanguage || 'french'"
        [flipDirection]="'up'"
        [isTouchscreen]="true"
      />
    }
  } @else {
    @if (currentSentence(); as sentence) {
      <app-sentence-card
        [sentence]="sentence"
        [mode]="mode()"
        (nextRequested)="onNextRequested()"
      />
    }
  }
</app-practice-host-shell>
