<section class="flex flex-col h-full w-full">
  <div class="flex-1 w-full flex items-center justify-center min-h-0 pb-4">
    <div
      #cardHost
      class="flex flex-col h-full w-[350px] border-2 rounded-2xl"
    >
      <div class="flex-1 min-h-0">
        <ng-content></ng-content>
      </div>
    </div>
  </div>

  <!-- NAV: bleibt unten -->
  <div class="pb-6 flex items-center w-full justify-center gap-3">
    <app-icon-button iconName="arrow_back" (onClick)="triggerPrev()" tooltip="Zurück"/>
    <div class="px-3 min-w-[80px] text-right font-semibold text-neutral-500">
      {{ index + 1 }} / {{ length }}
    </div>
    <app-icon-button iconName="arrow_forward" (onClick)="triggerNext()" tooltip="Weiter"/>

    @if (showShuffle) {
      <app-icon-button iconName="shuffle" (onClick)="triggerShuffle()" tooltip="Mischen"/>
    }
  </div>
</section>
