<button
  class="relative w-12 h-12 flex flex-row justify-center items-center gap-1 rounded-2xl border border-neutral-300 transition-colors duration-150 bg-transparent hover:bg-neutral-200 active:bg-neutral-300"
  (click)="onClick.emit($event)"
  [attr.aria-label]="tooltip || iconName"
>
  <mat-icon>{{ iconName }}</mat-icon>

  <span
    #tooltipEl
    class="pointer-events-none absolute opacity-0 y-0 whitespace-nowrap rounded bg-black px-2 py-1 text-xs text-white shadow-lg"
  >
      {{ tooltip }}
    </span>
</button>
