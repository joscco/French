@if (cards.length) {
  <section class="flex flex-col items-center gap-6 h-full w-full">
    <app-flashcard-container
      class="block w-full h-full"
      #fc
      [direction]="navDirection()"
      [meta]="current().meta || {}"
      [frenchPrimary]="current().frenchPrimary"
      [frenchExampleSentence]="current().frenchSecondary || ''"
      [germanPrimary]="current().germanPrimary"
      [germanExampleSentence]="current().germanSecondary || ''"
      [frontLang]="current().frontLanguage || 'french'"
      [isTouchScreen]="isTouchScreen"
      (next)="next()"
      (prev)="prev()"
    ></app-flashcard-container>
    <div class="flex items-center w-full justify-center gap-3">
      <app-icon-button iconName="arrow_back" (onClick)="prev()" tooltip="Zurück"></app-icon-button>
      <div class="px-3 min-w-[80px] text-right font-semibold text-neutral-500">
        {{ index() + 1 }} / {{ oriented().length }}
      </div>
      <app-icon-button iconName="arrow_forward" (onClick)="next()" tooltip="Weiter"></app-icon-button>
      <app-icon-button iconName="shuffle" (onClick)="shuffleCards()" tooltip="Mischen"></app-icon-button>
    </div>
    @if (isTouchScreen) {
      <div class="px-3 flex items-center text-sm italic opacity-50">
        <mat-icon>swap_horiz</mat-icon>
        <span class="ml-1">Karte wechseln über Pfeile oder Swipen</span>
      </div>
    }
  </section>
} @else {
  <p>Keine Karten in dieser Auswahl.</p>
}
